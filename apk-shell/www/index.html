<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no" />
<title>5201314</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html, body { height: 100%; }
  body {
    font-family: -apple-system, BlinkMacSystemFont, "PingFang SC", "Noto Sans SC", sans-serif;
    background: linear-gradient(160deg, #1c1917 0%, #292524 55%, #3b2432 100%);
    color: #f5f5f4;
    display: flex; flex-direction: column; align-items: center; justify-content: center;
    padding: 32px 24px calc(24px + env(safe-area-inset-bottom));
    min-height: 100vh;
  }
  .heart {
    width: 84px; height: 84px; border-radius: 24px; margin-bottom: 20px;
    background: linear-gradient(135deg, #fb7185, #e11d48);
    display: flex; align-items: center; justify-content: center;
    box-shadow: 0 12px 40px rgba(225, 29, 72, .35);
    font-size: 42px;
    animation: beat 1.6s ease-in-out infinite;
  }
  @keyframes beat { 0%,100% { transform: scale(1); } 12% { transform: scale(1.08); } 24% { transform: scale(1); } 36% { transform: scale(1.05); } 48% { transform: scale(1); } }
  h1 { font-size: 26px; letter-spacing: 2px; margin-bottom: 6px; }
  .sub { font-size: 13px; color: #a8a29e; margin-bottom: 34px; text-align: center; line-height: 1.7; }
  .card {
    width: 100%; max-width: 360px;
    background: rgba(255,255,255,.06); border: 1px solid rgba(255,255,255,.09);
    border-radius: 20px; padding: 22px 20px; backdrop-filter: blur(8px);
  }
  label { font-size: 12px; color: #d6d3d1; margin-bottom: 8px; display: block; }
  input {
    width: 100%; padding: 14px 14px; font-size: 15px; border-radius: 12px;
    border: 1px solid rgba(255,255,255,.14); background: rgba(0,0,0,.32); color: #fff;
    outline: none; transition: border-color .2s;
  }
  input:focus { border-color: #fb7185; }
  input::placeholder { color: #78716c; }
  button {
    width: 100%; margin-top: 16px; padding: 14px; font-size: 16px; font-weight: 600;
    border: none; border-radius: 12px; color: #fff; cursor: pointer;
    background: linear-gradient(135deg, #fb7185, #e11d48);
    box-shadow: 0 8px 24px rgba(225,29,72,.35); transition: transform .12s, opacity .2s;
  }
  button:active { transform: scale(.97); }
  button:disabled { opacity: .55; }
  .hint { font-size: 11.5px; color: #78716c; margin-top: 14px; line-height: 1.8; }
  .err { color: #fb7185; font-size: 12.5px; margin-top: 10px; min-height: 16px; }
  .row { display: flex; gap: 10px; align-items: stretch; }
  .row input { flex: 1; }
  .paste {
    margin-top: 0; width: auto; padding: 0 16px; font-size: 13px; white-space: nowrap;
    background: rgba(255,255,255,.1); box-shadow: none; border-radius: 12px; font-weight: 400;
  }
  #splash { display: none; text-align: center; width: 100%; max-width: 360px; }
  #splash .spin {
    width: 34px; height: 34px; margin: 6px auto 18px; border-radius: 50%;
    border: 3px solid rgba(255,255,255,.15); border-top-color: #fb7185;
    animation: rot 0.9s linear infinite;
  }
  @keyframes rot { to { transform: rotate(360deg); } }
  #splash .dest { font-size: 13px; color: #d6d3d1; word-break: break-all; margin-bottom: 4px; }
  #splash .count { font-size: 12px; color: #a8a29e; margin-bottom: 22px; }
  #splash button { background: rgba(255,255,255,.1); box-shadow: none; font-weight: 400; font-size: 14px; }
</style>
</head>
<body>

  <!-- 连接屏 -->
  <div id="connect">
    <div class="heart">❤</div>
    <h1>5201314</h1>
    <p class="sub">AI 情侣手机模拟器<br/>默认地址已内置，直接点「进入」即可</p>
    <div class="card">
      <label for="url">服务器地址</label>
      <div class="row">
        <input id="url" type="url" inputmode="url" autocomplete="off" spellcheck="false"
               placeholder="https://xxxxxxxx.example.com" />
        <button class="paste" id="pasteBtn" type="button">粘贴</button>
      </div>
      <div class="err" id="err"></div>
      <button id="goBtn" type="button">进入 ❤</button>
      <p class="hint">
        · 默认地址已内置，一般无需修改，直接点「进入」<br/>
        · 换服务器才需要改：填入你平时访问本站的完整网址<br/>
        · 想重新弹出本页：系统设置 → 应用 → 5201314 → 清除数据
      </p>
    </div>
  </div>

  <!-- 自动连接过场 -->
  <div id="splash">
    <div class="heart">❤</div>
    <div class="spin"></div>
    <div class="dest" id="dest"></div>
    <div class="count" id="count"></div>
    <button id="cancelBtn" type="button">更换服务器地址</button>
  </div>

<script>
(function () {
  var LS_KEY = 'server-url-5201314';
  /* 默认云端网关地址（已内置，一般无需修改） */
  var DEFAULT_URL = 'https://ws-ffbd-d-eacea-kbsjiwxzad.cn-beijing-vpc.fcapp.run';
  /* 本地代理入口：所有请求由它补上云网关要求的会话头 */
  var PROXY_SETUP = 'http://127.0.0.1:8999/__setup?upstream=';
  var $ = function (id) { return document.getElementById(id); };

  function normalize(raw) {
    var u = (raw || '').trim();
    if (!u) return null;
    if (!/^https?:\/\//i.test(u)) u = 'https://' + u;
    try {
      var p = new URL(u);
      if (!p.hostname) return null;
      return p.origin + (p.pathname && p.pathname !== '/' ? p.pathname.replace(/\/+$/, '') : '');
    } catch (e) { return null; }
  }

  function connect(url) {
    try { localStorage.setItem(LS_KEY, url); } catch (e) {}
    location.href = PROXY_SETUP + encodeURIComponent(url);
  }

  // 粘贴按钮
  $('pasteBtn').addEventListener('click', function () {
    if (navigator.clipboard && navigator.clipboard.readText) {
      navigator.clipboard.readText().then(function (t) {
        $('url').value = (t || '').trim();
        $('url').focus();
      }).catch(function () { $('url').focus(); });
    } else { $('url').focus(); }
  });

  // 手动连接
  $('goBtn').addEventListener('click', function () {
    var url = normalize($('url').value);
    if (!url) { $('err').textContent = '地址无效：请输入完整网址，如 https://xxx.example.com'; return; }
    $('err').textContent = '';
    $('goBtn').disabled = true;
    $('goBtn').textContent = '连接中…';
    try { localStorage.removeItem('skip-auto-5201314'); } catch (e) {}
    connect(url);
  });
  $('url').addEventListener('keydown', function (e) {
    if (e.key === 'Enter') $('goBtn').click();
  });

  // 已保存 / 默认 → 过场自动连接（skip-auto 标记时停在连接屏）
  var saved = null, skipAuto = false;
  try {
    saved = localStorage.getItem(LS_KEY);
    skipAuto = localStorage.getItem('skip-auto-5201314') === '1';
  } catch (e) {}
  var target = normalize(saved) || (skipAuto ? null : normalize(DEFAULT_URL));
  if (target) {
    $('connect').style.display = 'none';
    $('splash').style.display = 'block';
    $('dest').textContent = target;
    var left = 2;
    $('count').textContent = left + ' 秒后自动进入';
    var timer = setInterval(function () {
      left--;
      if (left <= 0) { clearInterval(timer); connect(target); return; }
      $('count').textContent = left + ' 秒后自动进入';
    }, 1000);
    $('cancelBtn').addEventListener('click', function () {
      clearInterval(timer);
      try {
        localStorage.removeItem(LS_KEY);
        localStorage.setItem('skip-auto-5201314', '1');
      } catch (e) {}
      location.reload();
    });
  } else {
    // 停在连接屏：预填上次地址或默认地址
    $('url').value = saved || DEFAULT_URL;
  }
})();
</script>
</body>
</html>
