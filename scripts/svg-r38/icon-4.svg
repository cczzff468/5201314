<svg width="1024" height="1024" viewBox="0 0 1024 1024" xmlns="http://www.w3.org/2000/svg">
  <!-- Cove 图标四「二次元版·樱花萌云」：樱花粉渐变底 + 萌系云朵（二次元大闪闪眼 +
       猫嘴 ω + 圆腮红）+ 左上爱心对话气泡 + 星星闪光点缀 + cove 玫瑰金单线字标 -->
  <defs>
    <linearGradient id="sakura" x1="0" y1="0" x2="0.25" y2="1">
      <stop offset="0%" stop-color="#FFF7F9"/>
      <stop offset="48%" stop-color="#FDE9F0"/>
      <stop offset="100%" stop-color="#FBD8E4"/>
    </linearGradient>
    <radialGradient id="pinkglow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#F9C2D2" stop-opacity="0.55"/>
      <stop offset="58%" stop-color="#F9C2D2" stop-opacity="0.2"/>
      <stop offset="100%" stop-color="#F9C2D2" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="eye" cx="50%" cy="30%" r="75%">
      <stop offset="0%" stop-color="#6B4E70"/>
      <stop offset="55%" stop-color="#4B3B52"/>
      <stop offset="100%" stop-color="#39303F"/>
    </radialGradient>
  </defs>
  <rect width="1024" height="1024" fill="url(#sakura)"/>

  <!-- 云朵身后柔粉光晕 -->
  <ellipse cx="552" cy="452" rx="330" ry="270" fill="url(#pinkglow)"/>

  <!-- 左上爱心对话气泡：圆角气泡 + 尾巴 + 内里小爱心 -->
  <path d="M 300 190 L 452 190 Q 480 190 480 218 L 480 288 Q 480 316 452 316 L 448 316 L 412 354 L 416 316 L 352 316 Q 300 314 300 288 L 300 218 Q 300 190 328 190 Z"
        fill="#FFFFFF" stroke="#E8A8BC" stroke-width="7" stroke-linejoin="round"/>
  <path d="M 390 232 C 382 220, 364 222, 362 236 C 360 252, 378 264, 390 274 C 402 264, 420 252, 418 236 C 416 222, 398 220, 390 232 Z"
        fill="#F06D93"/>

  <!-- 萌系云朵：Material 云路径放大 16.25 倍（与 icon-1 同源形状），白填充+玫瑰描边 -->
  <g transform="translate(355, 275) scale(16.25)">
    <path d="M19.35 10.04C18.67 6.59 15.64 4 12 4 9.11 4 6.6 5.64 5.35 8.04 2.34 8.36 0 10.91 0 14c0 3.31 2.69 6 6 6h13c2.76 0 5-2.24 5-5 0-2.64-2.05-4.78-4.65-4.96z"
          fill="#FFFFFF" stroke="#E8A8BC" stroke-width="0.37" stroke-linejoin="round"/>
  </g>

  <!-- 二次元大闪闪眼：深莓紫渐变椭圆 + 大高光 + 小高光（左眼 505 / 右眼 600） -->
  <ellipse cx="505" cy="470" rx="34" ry="42" fill="url(#eye)"/>
  <circle cx="517" cy="454" r="13" fill="#FFFFFF" opacity="0.95"/>
  <circle cx="494" cy="486" r="6.5" fill="#FFFFFF" opacity="0.75"/>
  <ellipse cx="600" cy="470" rx="34" ry="42" fill="url(#eye)"/>
  <circle cx="612" cy="454" r="13" fill="#FFFFFF" opacity="0.95"/>
  <circle cx="589" cy="486" r="6.5" fill="#FFFFFF" opacity="0.75"/>

  <!-- 猫嘴 ω：双弧小猫嘴（居中 552） -->
  <path d="M 528 522 Q 540 538 552 528 Q 564 538 576 522" fill="none" stroke="#4B3B52" stroke-width="7" stroke-linecap="round"/>

  <!-- 圆腮红（樱花粉，比 icon-1 加深一档） -->
  <ellipse cx="452" cy="512" rx="27" ry="14" fill="#F7AEC1"/>
  <ellipse cx="652" cy="512" rx="27" ry="14" fill="#F7AEC1"/>

  <!-- 星星闪光点缀（四芒小星，金白粉三色） -->
  <path d="M 210 470 C 217 496, 228 507, 254 514 C 228 521, 217 532, 210 558 C 203 532, 192 521, 166 514 C 192 507, 203 496, 210 470 Z" fill="#F5C86B" opacity="0.9"/>
  <path d="M 800 440 C 805 458, 813 466, 831 471 C 813 476, 805 484, 800 502 C 795 484, 787 476, 769 471 C 787 466, 795 458, 800 440 Z" fill="#F49CB6" opacity="0.9"/>
  <path d="M 760 250 C 765 268, 773 276, 791 281 C 773 286, 765 294, 760 312 C 755 294, 747 286, 729 281 C 747 276, 755 268, 760 250 Z" fill="#FFFFFF" opacity="0.9"/>

  <!-- 漂浮小爱心（右上/左下各一颗） -->
  <path d="M 880 620 C 872 608, 854 610, 852 624 C 850 640, 868 652, 880 662 C 892 652, 910 640, 908 624 C 906 610, 888 608, 880 620 Z" fill="#F58BA8" opacity="0.85"/>
  <path d="M 240 640 C 234 631, 221 633, 219 643 C 218 655, 231 663, 240 670 C 249 663, 262 655, 261 643 C 260 633, 247 631, 240 640 Z" fill="#F5A8BE" opacity="0.8"/>

  <!-- cove 单线字标（玫瑰金，几何同 icon-1：基线 880、字高 84、描边 10 圆头） -->
  <g fill="none" stroke="#C4708A" stroke-width="10" stroke-linecap="round" stroke-linejoin="round">
    <path d="M 357 805.8 A 42 42 0 1 0 357 870.2"/>
    <circle cx="448" cy="838" r="42"/>
    <path d="M 528 796 L 570 880 L 612 796"/>
    <path d="M 728.4 859 A 42 42 0 1 0 713 874.4"/>
    <path d="M 650 838 L 734 838"/>
  </g>
</svg>
