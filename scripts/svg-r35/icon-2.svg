<svg width="1024" height="1024" viewBox="0 0 1024 1024" xmlns="http://www.w3.org/2000/svg">
  <!-- Cove 图标二「弧 C 微笑」：机主参考图 1795606141984 逐元素矢量重绘
       米白底 + 石板蓝灰大 C 弧（圆头端点+端点圆钮）+ 弧内上侧一颗眼点 +
       下方独立微笑弧 + 宽字距 cove 单线小字标（参考图「小脸」气质） -->
  <rect width="1024" height="1024" fill="#F4F4F2"/>

  <defs>
    <!-- C 弧身后的柔影（径向渐变模拟 blur 光晕，librsvg 安全） -->
    <radialGradient id="softshadow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#EAEAE6" stop-opacity="0.85"/>
      <stop offset="62%" stop-color="#EAEAE6" stop-opacity="0.38"/>
      <stop offset="100%" stop-color="#EAEAE6" stop-opacity="0"/>
    </radialGradient>
  </defs>
  <ellipse cx="522" cy="428" rx="205" ry="180" fill="url(#softshadow)"/>

  <!-- C 弧：中心 (504,430) r=118，开口朝右（±38°），描边 16.5 圆头端点 -->
  <path d="M 596.9 357.3 A 118 118 0 1 0 596.9 502.7"
        fill="none" stroke="#8B93A6" stroke-width="16.5" stroke-linecap="round"/>
  <!-- 端点圆钮（弧两端各一颗小实心圆，参考图的「耳朵/终端点」） -->
  <circle cx="596.9" cy="357.3" r="10" fill="#8B93A6"/>
  <circle cx="596.9" cy="502.7" r="10" fill="#8B93A6"/>
  <!-- 眼点：C 开口上侧内一颗深石板色圆点（望向开口的「眼睛」） -->
  <circle cx="558" cy="374" r="17" fill="#5F6779"/>

  <!-- 微笑弧：独立于 C 下方（下巴式浅弧） -->
  <path d="M 394 648 Q 506 668 618 648" fill="none" stroke="#8B93A6" stroke-width="6.5" stroke-linecap="round"/>

  <!-- cove 单线字标：小号宽字距（字高 67、基线 810、描边 8 圆头、深石板色） -->
  <g fill="none" stroke="#4E5670" stroke-width="8" stroke-linecap="round" stroke-linejoin="round">
    <path d="M 406.5 750.3 A 33.5 33.5 0 1 0 406.5 801.7"/>
    <circle cx="479" cy="776" r="33.5"/>
    <path d="M 528 745 L 560 810 L 592 745"/>
    <path d="M 674 792.75 A 33.5 33.5 0 1 0 661.8 805"/>
    <path d="M 611.5 776 L 678.5 776"/>
  </g>
</svg>
